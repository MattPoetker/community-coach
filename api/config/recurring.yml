# Solid Queue recurring tasks. These are the jobs that make the product feel alive rather
# than a place you have to remember to visit.
production: &tasks
  event_reminders:
    class: Calendar::ReminderJob
    schedule: every 5 minutes

  materialise_occurrences:
    class: Calendar::RollHorizonJob
    schedule: every day at 3am

  daily_digests:
    class: Notifications::DailyDigestJob
    schedule: every day at 8am

development: *tasks
